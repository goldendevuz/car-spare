services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zapchastop_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-zapchastop_db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-change-this-secret-key}
    ports:
      - "8010:8000"

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_BASE: http://backend:8000
      SHOP_CREATE_PATH: /shops/create/
      PART_CREATE_PATH: /parts/create/
      TG_ADMIN_IDS: ${TG_ADMIN_IDS}
    volumes:
      - ./bot/data:/bot/data

volumes:
  db_data:
